<style>
/* Layout: single narrow column, one question card at a time, sticky progress strip on top */
:root{
  --bg:#f1eee8; --surface:#ffffff; --ink:#221a1c; --muted:#6f6467; --line:#ddd6cc;
  --accent:#8b0029; --accent-soft:#f3e2e7; --good:#13914a; --good-soft:#e0f3e7;
  --bad:#d9482a; --bad-soft:#fbe4dc; --flag:#a8650b; --flag-soft:#f6e8d0;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
/* 화면 색은 두 가지: 라이트(기본)와 다크. 기기 설정은 따르지 않고 사용자가 고른 걸 기억한다(#58) */
:root[data-theme="dark"]{
  --bg:#160d10; --surface:#21151a; --ink:#ece8e3; --muted:#a69a9d; --line:#3a2a30;
  --accent:#d6496f; --accent-soft:#3a1823; --good:#4fd08a; --good-soft:#143322;
  --bad:#ff7a55; --bad-soft:#3d1e16; --flag:#e8b25a; --flag-soft:#3a2c14; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:900;font-size:2rem;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.eyebrow+.logo{margin-top:10px}
.eyebrow+.score{margin-top:6px}
.modebar{display:flex;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap}
.mswitch{display:inline-flex;gap:2px;background:var(--line);border-radius:999px;padding:3px}
.mswitch button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:.92rem;font-weight:700;color:var(--muted)}
.mswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mswitch svg,.land-card svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.land{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.land-card{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:210px;justify-content:space-between;min-width:0}
.land-card:hover{border-color:var(--accent)}
.land-card .lt{font-family:var(--f-display);font-weight:900;font-size:1.7rem;line-height:1.1;display:flex;align-items:center;gap:8px}
.land-card .lt svg{width:22px;height:22px;color:var(--accent)}
.land-card .ld{font-size:.88rem;line-height:1.5;color:var(--muted);word-break:keep-all}
.land-card .ls{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.land-card.is-br{background:#8b0029;border-color:#8b0029;color:#e7e5e1}
.land-card.is-br .ld,.land-card.is-br .ls{color:rgba(231,229,225,.78)}
.land-card.is-br .lt svg{color:#e7e5e1}
.land-card.is-br:hover{border-color:#006b36}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.wk{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:transparent;display:flex;flex-direction:column;gap:4px;min-width:0}
.wk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.wk .t{font-weight:700;font-size:.95rem}
.wk .d{font-size:.8rem;color:var(--muted);line-height:1.35}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}.bar .b{background:var(--bad)}
.wk .meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:transparent;font-size:.9rem}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:1rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted)}

/* quiz */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.strip .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.dots{display:flex;gap:3px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.src{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.stem{font-size:1.08rem;font-weight:500;white-space:pre-line;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;
  background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;line-height:1.5}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .n{font-family:var(--f-mono);font-size:.85rem;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.choice .mark{font-size:.75rem;font-weight:700;padding-top:2px}
.choice:disabled{cursor:default}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .n{border-color:var(--good);color:var(--good)}
.choice.correct .mark{color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .n{border-color:var(--bad);color:var(--bad)}
.choice.wrong .mark{color:var(--bad)}
.choice.dim{opacity:.55}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.ref{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* result */
.score{font-family:var(--f-display);font-weight:900;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--muted);font-weight:800}
.wlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.wlist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.wlist .q{font-size:.9rem}
.wlist .a{font-size:.82rem;color:var(--good)}
@media (prefers-reduced-motion:no-preference){.card-in{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}}}

/* week card check */
.wk{position:relative;padding-right:50px}
.wk .chk{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s}
.wk .chk svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.wk[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent)}
.wk[aria-pressed="true"] .chk svg{opacity:1}
.foot{display:flex;justify-content:center}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}

/* intro */
.intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px));transition:opacity .45s}
.intro.out{opacity:0;pointer-events:none}
.intro-in{width:min(560px,100%);display:flex;flex-direction:column;gap:18px;position:relative;min-height:220px;justify-content:center}
.i-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78rem;letter-spacing:.06em;font-weight:700}
.i-tag{color:var(--muted)}
.i-state{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:all .2s}
.i-state.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.i-state.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.i-line{margin:0;font-size:clamp(1.25rem,4.6vw,1.75rem);font-weight:500;line-height:1.75;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;text-wrap:balance}
.i-line.show{opacity:1;transform:none}
.i-slot{position:relative;display:inline-block;padding:0 3px;border-radius:5px}
.i-slot::before{content:"";position:absolute;inset:8% 0;border-radius:5px;background:var(--flag-soft);transform-origin:left;transform:scaleX(0);transition:transform .4s ease-out;z-index:-1}
.i-slot.scan::before{transform:scaleX(1)}
.i-slot.done::before{background:var(--accent-soft)}
.i-word{font-family:var(--f-body);font-weight:700;white-space:nowrap}
.i-slot.swap .i-word{color:var(--accent)}
.i-old{position:absolute;left:50%;bottom:88%;transform:translate(-50%,8px);font-size:.55em;color:var(--bad);text-decoration:line-through;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s}
.i-slot.swap .i-old{opacity:1;transform:translate(-50%,0)}
.i-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transform:scale(.96);transition:opacity .35s,transform .35s;pointer-events:none}
.i-logo.show{opacity:1;transform:none}
.i-logo b{font-family:var(--f-display);font-weight:900;font-size:clamp(2.6rem,11vw,4rem);letter-spacing:-.03em;line-height:1}
.i-logo b span{color:var(--accent)}
.i-logo small{color:var(--muted);font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.i-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted)}

/* 이의제기 목록 + 알림 */
.errchip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--flag);background:var(--flag-soft);color:var(--flag);border-radius:12px;padding:10px 14px;font-weight:700}
.errchip small{font-weight:500;font-size:.8rem}
.errbox{width:100%;min-height:130px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;resize:vertical}
.errhelp{font-size:.88rem;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .2s,transform .2s;z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.themebtn{display:grid;place-items:center;width:38px;padding:5px 0}
.themebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.powered{flex:0 0 100%;display:flex;justify-content:center;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);margin-top:2px}
.logo-sym{height:1.05em;width:auto;vertical-align:-.16em;margin-right:.28em;border-radius:22%}
.a2hs{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-4px}
.a2hs .linkbtn{font-size:.85rem}
.a2hsx{background:transparent;border:0;color:var(--muted);font-size:1.1rem;padding:2px 8px;line-height:1}
/* 홈 화면 추가 팝업(#94)·첫 접속 연습 안내(#95) */
.a2sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;animation:a2up .3s ease-out}
.a2sheet>div{pointer-events:auto;max-width:420px;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.a2t{font-weight:700;font-size:.95rem;word-break:keep-all}
@keyframes a2up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.a2sheet{animation:none}}
.brintro{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:24px 18px}
.brintro-h{font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1.25}
.brintro .note{word-break:keep-all;text-wrap:balance}
.primary.big{padding:16px 20px;font-size:1.1rem}
.build{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.foot{gap:14px;align-items:center;flex-wrap:wrap}

/* brainrot 홈 패널 */
.brpanel{border:1.5px solid var(--accent)}
.brtitle{font-family:var(--f-display);font-weight:900;font-size:1.4rem;letter-spacing:-.01em;line-height:1.1}
.brtitle span{color:var(--accent)}
.brrow .eyebrow{min-width:2.6em}

/* brainrot 무대: 테마와 상관없이 어두운 쇼츠 화면 */
.br{position:fixed;inset:0;z-index:60;background:var(--bg0);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.br{
  --bg0:#f3f0ea;--ink:#1f1719;--m:#7a6e70;--l:#d8d0c5;--c:#ffffff;
  --a:#8b0029;--on-a:#ffffff;--f:#006b36;--g:#13914a;--r:#d9482a;--cb:#8b0029;
  --a-bg:#f5e4e8;--g-bg:#e2f4e8;--r-bg:#fde4db;--late:#d9482a;--ask-b:#d9b3bd;--flag-b:#a9cdb8;
  --kb:#b8ada1;--ov:rgba(243,240,234,.95);--ov2:rgba(243,240,234,.97);--shade:rgba(31,23,25,.3);
  --icon-bg:rgba(255,255,255,.92);--pill:rgba(31,23,25,.88);--pop:#ffffff;--pop-ink:#1f1719;--pop-sub:#7a6e70;
  --flash:rgba(139,0,41,.07);--flash2:rgba(0,107,54,.09);--gl-on:rgba(0,107,54,.14);--staff:rgba(31,23,25,.22);
  --glow-ok:rgba(19,145,74,.22);--glow-no:rgba(217,72,42,.22);
  --wk-h:342;--wk-s:45%;--wk-l0:88%;--wk-step:-2%;--wk-op:.35;
  --run-ground:#cdc4b8;--run-tick:#e1dad0;--run-dot:rgba(31,23,25,.09);--run-hurdle:#8b0029;--run-speed:rgba(0,107,54,.45);
  --run-pal:#0b2b1a,#2e8b57,#006b36,#7cc79a,#ffffff,#8b0029;
  --p2:#9a5a00;
}
:root[data-theme="dark"] .br{
  --bg0:#140b0e;--ink:#efebe6;--m:#a3979a;--l:#3b2a30;--c:#1f1418;
  --a:#e7e5e1;--on-a:#140b0e;--f:#e2486e;--g:#4fd08a;--r:#ff7a55;--cb:#e2486e;
  --a-bg:#2e2428;--g-bg:#12301f;--r-bg:#3a1a12;--late:#ff9b80;--ask-b:#4d3c42;--flag-b:#5e2a3a;
  --kb:#5d4a50;--ov:rgba(20,11,14,.94);--ov2:rgba(20,11,14,.96);--shade:rgba(20,11,14,.55);
  --icon-bg:rgba(45,32,37,.85);--pill:rgba(239,235,230,.92);--pop:#efebe6;--pop-ink:#140b0e;--pop-sub:#6d6266;
  --flash:rgba(231,229,225,.07);--flash2:rgba(226,72,110,.14);--gl-on:rgba(226,72,110,.2);--staff:rgba(239,235,230,.28);
  --glow-ok:rgba(79,208,138,.24);--glow-no:rgba(255,122,85,.24);
  --wk-h:342;--wk-s:70%;--wk-l0:16%;--wk-step:2%;--wk-op:.45;
  --run-ground:#3b2a30;--run-tick:#2a1d22;--run-dot:rgba(239,235,230,.09);--run-hurdle:#1f9e5c;--run-speed:rgba(226,72,110,.5);
  --run-pal:#8b0029,#e7e5e1,#c4bcb1,#ffffff,#ffffff,#8b0029;
  --p2:#e2486e;
}
.br-icon{box-shadow:0 4px 18px rgba(31,23,25,.18)}
.br button{color:var(--ink)}
.br-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 38%,var(--flash),transparent 62%);opacity:0;transition:opacity .35s}
.br-flash.on{opacity:1;transition:none}
.br-flash.down{background:radial-gradient(circle at 50% 38%,var(--flash2),transparent 62%)}
/* 주차별 배경색(#51-1): 색은 계산식으로만 정하고 장식일 뿐. 카드가 바뀌면 0.4초에 걸쳐 섞이고, 첫 박마다 살짝 밝아진다 */
.br-bg{position:absolute;inset:0;pointer-events:none;background-color:hsl(var(--wk-h) var(--wk-s) var(--wk-l0));opacity:var(--wk-op);transition:background-color .4s ease,opacity .6s ease;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.4) 50%,transparent 92%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.4) 50%,transparent 92%)}
.br-bg.pulse{opacity:1;transition:background-color .4s ease,opacity 0s}
.br-glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s ease;background:radial-gradient(130% 55% at 50% 100%,var(--gc,transparent),transparent 72%)}
.br-glow.ok{--gc:var(--glow-ok);opacity:1;transition:opacity .15s}
.br-glow.no{--gc:var(--glow-no);opacity:1;transition:opacity .15s}
/* 달리기 띠(#53) */
/* 홍보 영상용 여백 압축(#97, ?promo 전용): 무대 높이를 고정하고 요소를 화면 가운데로 모아 줌인 여지를 만든다. 일반 화면은 그대로 */
.br.promo{justify-content:center}
.br.promo .br-phase{margin-top:8px}
.br.promo .br-beat{margin:6px auto 0}
.br.promo .br-stage{flex:0 0 auto;height:clamp(300px,40vh,380px)}
.br.promo .br-card{gap:10px;padding-top:4px;padding-bottom:16px}
.br.promo .br-card.hasflag{padding-top:34px}
.br.promo .br-run{margin-bottom:4px}
.br.promo .br-hint{margin-top:6px}
.br.promo .br-glow{background:radial-gradient(150% 75% at 50% 100%,var(--gc,transparent),transparent 78%),radial-gradient(110% 55% at 50% 100%,var(--gc,transparent),transparent 72%),radial-gradient(80% 35% at 50% 100%,var(--gc,transparent),transparent 70%)}
.br-run{max-width:640px;width:100%;height:68px;margin:0 auto 8px;position:relative;flex:none}
.br-run canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.br.norun .br-run{display:none}
@media (max-width:520px){.brnote{min-height:3em;min-height:2lh}}
.br-ico[aria-pressed="false"].runb{color:var(--m)}
.br-top{display:flex;align-items:center;gap:8px;max-width:640px;width:100%;margin:0 auto;position:relative}
.br-btn{background:transparent;border:1.5px solid var(--l);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.br-prog{font-family:var(--f-mono);font-size:.85rem;color:var(--m);font-variant-numeric:tabular-nums;flex:1;text-align:center}
.br-combo{font-family:var(--f-display);font-weight:900;color:var(--cb);min-width:4.2em;text-align:center;font-size:.95rem}
.br{--ns:1.5} /* 음표 크기 배율(#81): 낮은 화면에서는 줄인다 */
@media (max-height:640px){.br{--ns:1.25}}
.br-beat{display:flex;justify-content:center;align-items:flex-end;gap:calc(18px*var(--ns));margin:12px auto 4px;position:relative}
.br-beat i{display:block;color:var(--l);transition:color .1s,transform .12s;transform-origin:50% 80%}
.br-beat i svg{display:block;width:calc(17px*var(--ns));height:calc(26px*var(--ns));fill:currentColor}
.br-beat i:first-child svg{width:calc(21px*var(--ns));height:calc(32px*var(--ns))}
.br-beat i.on{color:var(--a)}
.br-beat i:first-child.on{color:var(--f)}
.br-beat i.hit{transform:scale(1.3)}
.br-phase{margin-top:24px}
.br-beat i.last{color:var(--r)!important}
.br-beat::before{content:"";position:absolute;left:calc(-26px*var(--ns));right:calc(-26px*var(--ns));top:50%;height:calc(25px*var(--ns));transform:translateY(-38%);
  background:repeating-linear-gradient(to bottom,var(--staff) 0 1px,transparent 1px calc(6px*var(--ns)));opacity:0;transition:opacity .45s;pointer-events:none}
.br-beat.staff::before{opacity:1}
.br-beat i{position:relative}
/* 단원 모드(#93): 오선·높은음자리표·C 박자표를 늘 깔고, 다시 한 번 구간엔 도돌이표, 마지막엔 끝세로줄. 음표 자식 순서는 그대로 두고 가상 요소의 마스크로만 그린다 */

.br.orch .br-beat{margin-left:auto;transform:translateX(calc(18px*var(--ns)))}
.orow{display:flex;gap:8px;margin-top:12px}
.orow .primary{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.orow .ghost{min-height:44px;padding:0 18px}
.ogreet{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity .4s}
.ogreet.out{opacity:0;pointer-events:none}
.ogreet .og-in{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(320px,80vw)}
.ogreet svg{width:100%;height:auto;overflow:visible}
.ogreet line{stroke:var(--ink);stroke-opacity:.4;stroke-width:1.2;stroke-dasharray:300;stroke-dashoffset:300;animation:ogline .9s ease-out forwards}
.ogreet .og-clef{fill:var(--ink);opacity:0;animation:ogfade .5s .7s forwards}
.ogreet .og-t{font-weight:700;font-size:1.05rem;color:var(--ink);opacity:0;animation:ogfade .5s 1.1s forwards;text-align:center}
.ogreet.still line{animation:none;stroke-dashoffset:0}.ogreet.still .og-clef,.ogreet.still .og-t{animation:none;opacity:1}
@keyframes ogline{to{stroke-dashoffset:0}}@keyframes ogfade{to{opacity:1}}
.br-guide{position:absolute;inset:0;z-index:3;background:var(--ov2);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px;text-align:center;cursor:pointer;transition:opacity .25s}
.br-guide.out{opacity:0}
.br-guide-h{font-weight:700;font-size:1rem;color:var(--ink)}
.br-guide-lr{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.br-guide .side{border:2px solid var(--l);border-radius:18px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.br-guide .side b{font-family:var(--f-display);font-weight:900;font-size:2.6rem;line-height:1}
.br-guide .side b.sm{font-size:1.5rem;line-height:1.3}
.br-guide .side span{font-size:.8rem;color:var(--m)}
.br-guide .keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.br-guide kbd{font-family:var(--f-mono);font-size:1rem;min-width:2em;padding:4px 8px;border-radius:7px;border:1.5px solid var(--kb);border-bottom-width:3px;background:var(--c);color:var(--ink)}
.br-guide-f{font-size:.8rem;color:var(--m)}
/* 터치 가이드: 실제 화면 위에 구역 표시 */
.br-guide.gest{justify-content:space-between;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.br-guide .gz{position:absolute;left:12px;right:12px;display:grid;grid-template-columns:calc(25vw - 12px) 1fr calc(25vw - 12px);gap:6px}
.br-guide .z{border:2px dashed var(--kb);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center}
.br-guide .z b{font-family:var(--f-display);font-weight:900;font-size:1.3rem;color:var(--f)}
.br-guide .z span{font-size:.82rem;color:var(--ink);word-break:keep-all}
.br-guide .z small{font-size:.74rem;color:var(--m);margin-top:6px}
.br-guide .z.mid{border-color:var(--a)}
.br-guide .z.mid b{color:var(--a)}
/* 2배속 알약, 가운데 멈춤/재생 아이콘, 뜻풀이 배지 */
.br-speed{position:absolute;left:50%;top:150px;transform:translate(-50%,-6px);z-index:4;background:var(--pill);color:var(--bg0);font-weight:900;font-size:.85rem;padding:5px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.br-speed.on{opacity:1;transform:translate(-50%,0)}
.br-icon{position:absolute;left:50%;top:48%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center;z-index:4;opacity:0;transform:scale(.85);pointer-events:none;transition:opacity .2s,transform .2s}
.br-icon.on{opacity:1;transform:none}
.br-icon svg{width:36px;height:36px;fill:var(--ink)}
.br-badge{position:absolute;left:50%;top:120px;transform:translate(-50%,-50%);z-index:4;background:var(--f);color:var(--on-a);font-weight:900;font-size:.8rem;padding:4px 12px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.br-badge.on{opacity:1}
.br.glpause #brbeat{opacity:.25}
/* 뜻풀이 밑줄과 말풍선 */
.gl{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--f);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;padding:2px 1px;margin:-2px -1px;border-radius:4px}
.gl{position:relative}
.gl-mag{position:absolute;left:-1px;bottom:-1.02em;width:.9em;height:.9em;fill:none;stroke:var(--f);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.gl.on{background:var(--gl-on)}
.gl:focus-visible{outline:2px solid var(--f);outline-offset:2px}
.gl-shade{position:absolute;inset:0;z-index:5;background:var(--shade)}
.gl-pop{position:absolute;z-index:6;background:var(--pop);color:var(--pop-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.45);text-align:left}
.gl-pop b{font-weight:900;font-size:1rem}
.gl-pop div{font-size:.92rem;line-height:1.55;word-break:keep-all}
.gl-pop small{font-size:.72rem;color:var(--pop-sub)}
/* 도전 모드 문제 중 멈춤: 문제와 O/X를 흐리게 */
.br.blurq .br-s,.br.blurq .br-ans{filter:blur(10px);opacity:.5}
.br .br-stage,.br .br-ans{-webkit-touch-callout:none}
.br-phase{display:flex;justify-content:center;gap:6px;font-size:.76rem;font-weight:700;position:relative}
.br-phase span{padding:3px 10px;border-radius:999px;color:var(--m);border:1px solid var(--l)}
.br-phase span.cur{color:var(--on-a);background:var(--a);border-color:var(--a)}
.br-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:640px;margin:0 auto;min-height:0;position:relative;cursor:default}
.br-card{width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;max-height:100%;overflow:auto;padding:8px 2px 22px}
.br-tag{font-size:.78rem;color:var(--m);font-weight:700}
.br-tag b{color:var(--f)}
.br-s{font-size:clamp(1.35rem,5.4vw,2rem);font-weight:700;line-height:1.45;text-wrap:balance;word-break:keep-all}
.br-count{font-family:var(--f-display);font-weight:900;font-size:clamp(4rem,24vw,7.5rem);line-height:1;color:var(--a)}
.br-mark{font-family:var(--f-display);font-weight:900;font-size:clamp(4rem,22vw,7rem);line-height:1}
.br-mark.txt{font-size:clamp(1.7rem,7.5vw,2.6rem);line-height:1.25;word-break:keep-all}
.br-verdict{font-family:var(--f-display);font-weight:900;font-size:1.25rem}
.br .is-ok{color:var(--g)}.br .is-no{color:var(--r)}.br .is-mid{color:var(--m)}
.br-ex{font-size:1.1rem;line-height:1.6;text-wrap:pretty;word-break:keep-all;max-width:32em}
.br-more-h{font-size:.8rem;font-weight:900;letter-spacing:.12em;color:var(--f)}
.br-more{font-size:clamp(1.15rem,4.6vw,1.45rem);font-weight:500;line-height:1.6;word-break:keep-all;text-wrap:pretty;max-width:30em}
.br-flagrow{position:absolute;top:8px;right:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.br-flag.br-ask{border-color:var(--ask-b)!important;color:var(--a)!important;display:inline-flex;align-items:center;gap:4px}
.br-ask .ext{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.br-card.hasflag{padding-top:38px}
.br-stat{display:inline-flex;align-items:baseline;gap:8px} /* #90: 콤보·점수 글자 기준선을 맞춘다 */
@media (max-height:700px){.br-mark{font-size:clamp(3rem,14vw,4.4rem)}} /* #98: 낮은 화면에서 큰 O/X 때문에 카드가 잘리지 않게 */
.br-tagrow{display:contents}

function setTheme(t){
  document.documentElement.dataset.theme=t==="dark"?"dark":"light";
  if(!PROMO){try{localStorage.setItem(THK,curTheme())}catch(e){}}
  try{runColors()}catch(e){}
  syncThemeUI();
}
function syncThemeUI(){

    document.querySelectorAll(".themebtn").forEach(b=>{b.innerHTML=d?IC_SUN:IC_MOON;b.setAttribute("aria-label",d?"라이트 화면으로 바꾸기":"다크 화면으로 바꾸기");b.title=d?"라이트 화면":"다크 화면"});

  }catch(e){}
}

let store={};
try{store=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){store={}}
store.last=store.last||{};store.flags=store.flags||{};
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
/* 방문 집계(#85): GoatCounter(primer.goatcounter.com). 이벤트 이름만 보내고 카드·점수·기록은 보내지 않는다.
   홍보 녹화(?promo)는 세지 않고, 막히거나 에러가 나도 사이트는 그대로 돌아간다. onceKey가 있으면 이 브라우저에서 한 번만 보낸다 */
const gcQ=[];
function gcFlush(){try{const g=window.goatcounter;while(gcQ.length&&g&&typeof g.count==="function"){const n=gcQ.shift();g.count({path:n,title:n,event:true})}}catch(e){}}
function gcEvent(name,onceKey){
  try{
    if(PROMO)return;
    if(onceKey){store.ev=store.ev||{};if(store.ev[onceKey])return;store.ev[onceKey]=1;save()}
    gcQ.push(name);
    const g=window.goatcounter;
    if(g&&typeof g.count==="function"){gcFlush();return}
    if(!gcEvent.w){gcEvent.w=1;const sc=document.querySelector("script[data-goatcounter]");if(sc)sc.addEventListener("load",gcFlush)}
  }catch(e){}
}

const weekKeys=Object.keys(WEEKS).map(Number);
let sel=new Set(weekKeys), mode="random", session=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=["①","②","③","④","⑤"];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function weekStat(w){const qs=QUESTIONS.filter(q=>q.w===w);let ok=0,no=0;qs.forEach(q=>{if(store.last[q.id]===true)ok++;else if(store.last[q.id]===false)no++});return{n:qs.length,ok,no}}
function pool(){
  let qs=QUESTIONS.filter(q=>sel.has(q.w));
  if(mode==="wrong")qs=qs.filter(q=>store.last[q.id]===false);
  if(mode==="flag")qs=qs.filter(q=>store.flags[q.id]);
  if(mode==="new")qs=qs.filter(q=>!(q.id in store.last));
  return qs;
}

/* 소리: Web Audio로 합성. 박자 시계는 performance.now()를 쓰고, 소리는 그 시각에 맞춰 미리 예약한다. */
let AC=null;
const now=()=>performance.now()/1000;
/* 소리 엔진. 다른 앱이 소리를 쓰고 돌아오면 아이폰이 엔진을 '중단' 상태로 두는데, 이때는 새로 만들어야 살아난다(#41).
   박 소리는 매번 새 소리를 만들어 쓰므로 엔진을 갈아도 다시 연결할 것이 없다. 반드시 사용자가 누른 순간에 부른다. */
function mkAC(){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  const a=new C();a._ran=a.state==="running";
  a.onstatechange=()=>{
    if(a!==AC)return;
    if(a.state==="running"){a._ran=true;return}
    if(a._ran&&G&&!G.paused&&!G.muted){try{brPause()}catch(e){}} // 게임 중 소리가 끊기면 소리 없이 흘러가지 않게 멈춘다
  };
  return a;
}
function audioInit(fresh){
  try{
    if(AC&&(fresh||AC.state==="closed")){try{AC.onstatechange=null;AC.close()}catch(e){}AC=null}
    if(!AC)AC=mkAC();
    if(AC&&AC.state!=="running")AC.resume().catch(()=>{});
  }catch(e){AC=null}
}
/* 게임 중 누르거나 키를 눌렀는데 엔진이 안 돌고 있으면, 그 누름을 이용해 새로 만든다 */
function audioRetry(){
  if(!G||G.muted||!AC||AC.state==="running")return;
  audioInit(true);toast("소리를 다시 연결했어요");
  setTimeout(()=>{if(G&&!G.muted&&AC&&AC.state!=="running")hint("소리가 안 나면 화면을 한 번 더 탭해 보세요")},600);
}
document.addEventListener("pointerdown",audioRetry,true);
document.addEventListener("keydown",audioRetry,true);
function tone(t,freq,dur,type,vol){
  if(!AC||!G||G.muted)return;
  try{if(AC.state!=="running")return;const at=AC.currentTime+Math.max(0,t-now()),o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.006);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+dur+0.03)}catch(e){}
}
function beatSound(t,pb,warn){
  const base=523.25*Math.pow(2,Math.min(G?G.combo:0,12)/12);
  if(warn){tone(t,1760,0.045,"square",0.09);tone(t+0.1,1760,0.045,"square",0.09);return} // 마지막 박: 틱틱
  if(pb===0){tone(t,base*2,0.38,"sine",0.32);tone(t,base*3,0.22,"sine",0.07)}
  else tone(t,base,0.11,"triangle",0.22);
}

/* 아이폰 무음 스위치 대응: 사용자가 누른 순간 소리 없는 오디오를 반복 재생해 두면 Web Audio 소리가 나는 경우가 있다 */
let silentEl=null;
function unlockSilent(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{
    if(!silentEl){
      const n=800,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
      w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
      silentEl=document.createElement("audio");silentEl.src=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
      silentEl.loop=true;silentEl.setAttribute("playsinline","");silentEl.setAttribute("x-webkit-airplay","deny");silentEl.preload="auto";
    }
    if(!brMuted){const p=silentEl.play();if(p&&p.catch)p.catch(()=>{})}
  }catch(e){}
}

},true);

 br:()=>`<h2>Reels 사용법</h2>
   <section><ul>

     <li><b>도전 모드</b>: 음표가 다 꺼지기 전에 O/X(두 보기 카드는 앞·뒤)를 눌러요. 마지막 박에는 음표와 글씨가 빨개지고 "틱틱" 소리가 나요.</li>
     <li>키보드: 왼쪽(O·앞)은 ← 1 Q , / 오른쪽(X·뒤)은 → 2 W . — 한/영 상관없어요.</li>
     <li><b>터치</b>: 화면 양옆을 꾹 누르는 동안 2배속. 화면을 탭하면 멈춤/재개, 가운데를 꾹 누르면 누르는 동안 멈춰요. 도전 모드는 문제 중엔 멈출 수 없고, 정답·알고 가기에서는 돼요.</li>
     <li><b>키보드</b>: ↓를 누르고 있는 동안 2배속. Space·Enter가 가운데 탭과 같아요(도전 모드는 문제 중 제외). Esc는 일시정지 메뉴예요.</li>
     <li>2배속은 답할 시간만 줄어요. 점수는 보통 속도 기준이에요. 도전 모드에서 문제 중에 멈추면 문제가 흐려져요.</li>
     <li>정답·알고 가기의 <b>밑줄 친 말</b>을 누르면 잠깐 멈추고 뜻풀이를 보여줘요.</li>

     <li>오른쪽 위 아이콘은 달리기 띠 켬/끔, 화면 색(라이트·다크), 소리 켬/끔이에요.</li></ul></section>
   <section><h3>점수</h3><ul>

     <li>연속으로 맞히면 콤보 보너스가 +10씩, 최대 +50까지 붙어요. 얻은 점수는 오른쪽 위 점수 아래에 잠깐 떠요.</li>

   <section><h3>외운 카드</h3><ul>
     <li>도전 모드에서 <b>서로 다른 판에서 연속 2번</b> 맞히면 외운 카드예요. 한 번이라도 틀리면 다시 처음부터 세요.</li>

function openHelp(kind){
  const old=document.getElementById("help");if(old)old.remove();
  const body=(HELP[kind]||HELP.nje)();
  const el=document.createElement("div");el.className="help";el.id="help";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","사용법");
  el.innerHTML=`<div class="help-in"><div style="display:flex;justify-content:flex-end"><button class="ghost" id="helpx">닫기</button></div>${body}<div class="build">빌드 ${BUILD}</div></div>`;
  document.body.appendChild(el);
  const close=()=>{el.remove();document.removeEventListener("keydown",onKey,true);const hb=document.getElementById("helpbtn");if(hb)hb.focus({preventScroll:true})};
  const onKey=e=>{if(e.key==="Escape"){e.preventDefault();close()}};
  document.addEventListener("keydown",onKey,true);
  el.addEventListener("click",e=>{if(e.target===el)close()});
  document.getElementById("helpx").onclick=close;
  const pa=document.getElementById("pracagain");if(pa)pa.onclick=()=>{close();brStart({practice:true,replay:true})};
  document.getElementById("helpx").focus({preventScroll:true});
}
